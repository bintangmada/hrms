name: HRMS CI/CD Pipeline

# ==============================================================================
# TRIGGER: Pipeline berjalan otomatis setiap kali ada push ke branch development
# ==============================================================================
on:
  push:
    branches:
      - development

# ==============================================================================
# PERMISSIONS: Izin keamanan yang dibutuhkan untuk mempublikasikan image ke GHCR
# ==============================================================================
permissions:
  packages: write
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # TAHAP 1: BUILD & PUSH (Membuat Docker Image dan mengunggahnya ke GitHub Registry)
  # ----------------------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Mendownload source code dari repositori GitHub
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Menyiapkan sistem pembangun Docker (Buildx)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3. Login ke GitHub Container Registry (GHCR.io) menggunakan token bawaan GitHub
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Melakukan build Docker Image berdasarkan Dockerfile dan mempublikasikannya ke GHCR
      # Image disimpan dengan format huruf kecil agar tidak terjadi error penamaan registry
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          # Menyimpan image ke GHCR dengan tag 'latest'
          tags: ghcr.io/${{ github.repository_owner }}/hrms-backend:latest
          # Menggunakan cache Docker agar proses build berikutnya berjalan sangat cepat
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # TAHAP 2: DEPLOY (Masuk ke VPS lewat SSH dan mengaktifkan kontainer baru)
  # ----------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push # Tahap ini baru berjalan setelah Tahap 1 sukses
    steps:
      # 1. Mendownload source code ke runner agar bisa menyalin file docker-compose.yml
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Membuat folder target di VPS terlebih dahulu agar proses SCP tidak error
      - name: Create hrms directory on VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: mkdir -p ~/hrms

      # 3. Menyalin file docker-compose.yml dari repositori GitHub ke VPS
      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "docker-compose.yml"
          target: "~/hrms/"

      # 4. Mengirimkan instruksi SSH untuk menjalankan kontainer baru
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          # Daftar perintah yang dijalankan di terminal VPS Anda:
          script: |
            cd ~/hrms
            
            # Login ke GHCR di sisi VPS agar diizinkan mendownload image private Anda
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Download versi Docker Image backend terbaru dari registry
            docker compose pull backend
            
            # Nyalakan ulang kontainer backend secara background tanpa mematikan database
            docker compose up -d backend
            
            # Bersihkan sisa-sisa image Docker lama yang sudah tidak terpakai (menghemat disk space VPS)
            docker image prune -f

