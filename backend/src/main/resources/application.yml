server:
  port: 8020

spring:
  application:
    name: hrms-backend

  # Database Connection Configuration (PostgreSQL)
  # Database Username and Password are retrieved from environment variables as requested
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hrms_main}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  # JPA & Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Custom JWT Security Configuration
app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3JldC1rZXktZm9yLWhybXMtYXBwbGljYXRpb24td2hpY2gtaXMtc3VmZmljaWVudGx5LWxvbmc=}
    expiration-ms: 86400000 # 24 Hours (in milliseconds)

